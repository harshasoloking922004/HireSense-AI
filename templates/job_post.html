<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job | HireSense AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            min-height: 100vh;
        }

        .navbar {
            background: #1f2937;
            color: white;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 15px;
        }

        .container {
            width: 90%;
            max-width: 850px;
            margin: 40px auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #1f2937;
        }

        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #374151;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #1d4ed8;
        }

        .back-btn {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            color: #2563eb;
            font-weight: bold;
        }

        .message {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 8px;
            background: #dcfce7;
            color: #166534;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">HireSense AI</div>

        <div class="nav-links">
            <a href="/recruiter-dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>

    <div class="container">

        <div class="card">

            <h1>Post a New Job</h1>

            <p class="subtitle">
                Add job requirements so HireSense AI can match suitable candidates.
            </p>

            {% if message %}
                <div class="message">
                    {{ message }}
                </div>
            {% endif %}

            <form action="/post-job" method="POST">

                <div class="form-group">
                    <label for="title">Job Title</label>
                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Example: Data Scientist"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="company">Company</label>
                    <input
                        type="text"
                        id="company"
                        name="company"
                        placeholder="Example: ABC Technologies"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input
                        type="text"
                        id="location"
                        name="location"
                        placeholder="Example: Hyderabad"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="required_skills">
                        Required Skills
                    </label>

                    <input
                        type="text"
                        id="required_skills"
                        name="required_skills"
                        placeholder="Python, SQL, Machine Learning, Pandas"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="experience">
                        Experience Required
                    </label>

                    <input
                        type="number"
                        id="experience"
                        name="experience"
                        min="0"
                        placeholder="Example: 2"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">
                        Job Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter job responsibilities, requirements and other details..."
                        required
                    ></textarea>
                </div>

                <button type="submit" class="submit-btn">
                    Post Job
                </button>

            </form>

            <a href="/recruiter-dashboard" class="back-btn">
                ← Back to Recruiter Dashboard
            </a>

        </div>

    </div>

</body>
</html>
